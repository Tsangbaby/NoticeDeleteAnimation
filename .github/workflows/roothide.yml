name: RootHide source build
on:
  workflow_dispatch:
  push:
    branches: ['build/**', 'fix/ios16-diagnostics-alpha2', 'fix/settings-registration-alpha3', 'fix/settings-content-alpha4', 'fix/ancestor-diagnostics-alpha5', 'fix/clipping-geometry-alpha6', 'fix/partial-visibility-alpha7']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.ci-theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain and package tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version
          for tool in make ldid dpkg xz; do
            brew list --versions "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Checkout actual RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout 958fea4f779943505b15b93c88bb4db8d97b346d
          git -C "$THEOS" submodule update --init --recursive
          mkdir -p build-evidence
          git -C "$THEOS" rev-parse HEAD > build-evidence/theos-commit.txt
          git -C "$THEOS" submodule status --recursive > build-evidence/theos-submodules.txt
          xcodebuild -version > build-evidence/xcode.txt
          swift --version > build-evidence/swift.txt
          xcrun --sdk iphoneos --show-sdk-path > build-evidence/sdk-path.txt
          git rev-parse HEAD > build-evidence/source-commit.txt
      - name: Configure pinned Preferences framework linker stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-frameworks/Preferences.framework
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/theos/sdks/0222fd5413cf4b9af096f37b4621afa2688572f7/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd' -o .ci-frameworks/Preferences.framework/Preferences.tbd
          echo '9daceaff6cf94346594a12f9ef9c2ea23de15475b516f9e33c20871a018c098b  .ci-frameworks/Preferences.framework/Preferences.tbd' | shasum -a 256 -c - | tee build-evidence/preferences-stub.txt
      - name: Execute production Core XCTest
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee build-evidence/core-tests.txt
      - name: Real simulator Preferences load regression
        shell: bash
        run: bash Scripts/test_preferences_native.sh
      - name: Real simulator production ancestor gate regression
        shell: bash
        run: bash Scripts/test_ancestors_native.sh
      - name: Real simulator full-chain visible region regression
        if: success() || failure()
        shell: bash
        run: bash Scripts/test_visible_region_native.sh
      - name: Real simulator cropped capture pixel regression
        if: success() || failure()
        shell: bash
        run: bash Scripts/test_capture_native.sh
      - name: Real simulator partial Animator and runtime-shim hook regression
        if: success() || failure()
        shell: bash
        run: bash Scripts/test_partial_native.sh
      - name: Compile and package arm64 plus arm64e
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build-evidence/build.txt
      - name: Inspect produced package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence/extracted
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb --field "${debs[0]}" | tee build-evidence/control.txt
          dpkg-deb --contents "${debs[0]}" > build-evidence/contents.txt
          dpkg-deb --extract "${debs[0]}" build-evidence/extracted
          python3 Scripts/validate_package.py "${debs[0]}" build-evidence/extracted > build-evidence/package-validation.json
          python3 Scripts/validate_preferences.py build-evidence/extracted > build-evidence/preferences-validation.json
          dylib="$(python3 -c 'from pathlib import Path; a=list(Path("build-evidence/extracted").rglob("NoticeDeleteAnimation.dylib")); assert len(a)==1; print(a[0])')"
          xcrun lipo -info "$dylib" | tee build-evidence/lipo.txt
          xcrun otool -L "$dylib" > build-evidence/dependencies.txt
          xcrun otool -l "$dylib" > build-evidence/load-commands.txt
          ldid -e "$dylib" > build-evidence/entitlements.txt
          shasum -a 256 "${debs[0]}" "$dylib" > build-evidence/SHA256SUMS
      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoticeDeleteAnimation-roothide-${{ github.sha }}
          path: |
            packages/*.deb
            build-evidence/
          if-no-files-found: error
          retention-days: 14
